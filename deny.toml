# cargo-deny config — runs as part of `mise run audit` / `mise run ci`.
# Allowlist tuned to the actual transitive set; tighten when deps drift.

[graph]
all-features = true
no-default-features = false

[advisories]
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.92
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
